allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  # layers/db-sqlite: better-sqlite3 ships prebuilt binaries for all platforms. Allowing its build would
  # trigger a node-gyp compile, which needs a C++ toolchain (Visual Studio on Windows).
  better-sqlite3: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - nuxt@4.6.1
